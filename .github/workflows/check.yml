name: Checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Validate Python syntax
        run: python -m py_compile main.py

      - name: Validate JSON
        run: |
          python -m json.tool plugin.json >/dev/null
          python -m json.tool package.json >/dev/null

      - name: Validate modern Decky frontend build
        run: |
          cp dist/index.js /tmp/tested-dist-index.js
          npm run build
          test -s dist/index.js
          cp /tmp/tested-dist-index.js dist/index.js

      - name: Build release ZIP from validated runtime
        run: npm run package
