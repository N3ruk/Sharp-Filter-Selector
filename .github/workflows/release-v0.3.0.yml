name: Publish v0.3.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v0.3.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend
        run: npm run build

      - name: Package plugin
        run: npm run package

      - name: Prepare release notes
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## Sharp Filter Selector 0.3.0

          First public release of Sharp Filter Selector for Decky Loader.

          ### Features

          - Switch Gamescope scaling between **FSR** and **NIS** from the Quick Access Menu.
          - Adjust **NIS sharpness** on a simple 0–5 scale.
          - Detect active Gamescope/Xwayland sessions automatically.
          - Preserve the selected filter and sharpness between Decky sessions.
          - Uses Gamescope properties directly; it does not replace or patch Gamescope.
          - Portable across compatible Decky/Gamescope Linux environments.

          ### Installation

          Download `sharp-filter-selector-v0.3.0.zip` from the assets below and install it through Decky Loader's plugin/developer installation flow.

          See the repository README for requirements, usage and troubleshooting.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0             release/sharp-filter-selector-v0.3.0.zip             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Sharp Filter Selector 0.3.0"             --notes-file /tmp/release-notes.md
